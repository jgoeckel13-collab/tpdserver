# Fly.io settings for the Tisbury PD Digital Receptionist (single machine + data volume)
app = "tisbury-pd-receptionist"
primary_region = "bos"

[build]

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"

[mounts]
  source = "pdrecep_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
